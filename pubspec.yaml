name: scolarhub
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  
  # Gestion des icônes de base
  cupertino_icons: ^1.0.8

  # Réseau & Communication Temps Réel
  http: ^1.2.0
  socket_io_client: ^3.1.5

  # Stockage Local & Utilitaires
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  url_launcher: ^6.2.5

  # Gestion des fichiers & Médias
  image_picker: ^1.0.7
  file_picker: ^8.0.0+1
  path_provider: ^2.1.1

  # Interface Graphique & Charts
  fl_chart: ^1.2.0

  # Moteur de génération et d'impression PDF
  pdf: ^3.12.0
  printing: ^5.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/programme_semaine.png