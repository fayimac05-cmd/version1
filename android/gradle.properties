org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dhttps.protocols=TLSv1.2,TLSv1.3
android.useAndroidX=true
android.enableJetifier=true

# ── Reglages reseau pour connexions lentes/instables ────────────────
# Delais de connexion et de lecture des telechargements Gradle portes a
# 120 s (par defaut ~10 s), pour eviter "Remote host terminated the
# handshake" sur le telechargement des artefacts Flutter Android.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=120000
systemProp.org.gradle.internal.repository.max.tentatives=6
systemProp.org.gradle.internal.repository.initial.backoff=1000
